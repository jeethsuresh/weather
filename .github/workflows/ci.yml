name: Check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        run: |
          git clone --depth 1 --branch 3.32.0-0.2.pre https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - name: Install dependencies
        run: flutter --no-version-check pub get --enforce-lockfile
      - name: Analyze
        run: flutter --no-version-check analyze
      - name: Test
        run: flutter --no-version-check test --reporter expanded
